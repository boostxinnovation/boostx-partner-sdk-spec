name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -B -m unittest discover -s tools -p 'test_*.py'
      - run: python3 tools/check_vectors.py
      - run: python3 tools/check_marks.py --catalogue --docs-pointers --platform-notes --agents
      - run: npx --yes prettier@3.9.6 --check "vectors/*.json"
